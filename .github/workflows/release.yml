name: Release

# Build native installers for Windows, macOS, and Linux and attach them to a
# GitHub release. Triggered by pushing a tag like `v0.1.0`, or manually from the
# Actions tab (use "Run workflow" and supply a tag name).
#
# Tauri apps can't be cross-compiled from one OS — each platform needs its own
# toolchain + native webview — so this runs on three OS runners in parallel.
# Builds are unsigned; users may see an "unidentified developer" warning until
# signing certificates are configured.
#
# The in-app updater requires TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD repo
# secrets (the bundler fails without them because an updater pubkey is
# configured). Releases are published non-draft so `releases/latest` (the
# updater endpoint) resolves immediately.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal binary covering Apple Silicon + Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_PRIVATE_KEY secret is missing. The updater pubkey in tauri.conf.json makes the bundler require the private key — add TAURI_PRIVATE_KEY and TAURI_KEY_PASSWORD as repo secrets."
            exit 1
          fi

      # On manual dispatch, build the exact commit the tag points at — the
      # workflow's branch ref might differ from the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.platform }}

      - name: Add macOS targets (universal binary)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4  # tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App-update signing (tauri updater): signs the update bundles and
          # emits latest.json to the release (required, see preflight above).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseName: "Taxa ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: |
            Cross-platform builds for Windows, macOS, and Linux.
            Download the asset matching your platform from the list below.
          # Non-draft: the updater endpoint is releases/latest, which never
          # resolves to a draft — publishing a draft manually would leave
          # in-app updates 404ing until then.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Standalone taxa-mcp binaries, uploaded to the same release. Runs after the
  # app release exists. Native per-platform build (universal on macOS).
  mcp-binaries:
    permissions:
      contents: write
    needs: publish
    # Run even if a publish platform flaked (e.g. the macOS DMG step is
    # intermittently flaky) so the MCP binaries aren't stranded.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            artifact: taxa-mcp-linux-x86_64
          - platform: windows-latest
            artifact: taxa-mcp-windows-x86_64.exe
          - platform: macos-latest
            artifact: taxa-mcp-macos-universal
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: mcp-${{ matrix.platform }}

      - name: Add macOS targets (universal binary)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build taxa-mcp (Linux / Windows)
        if: matrix.platform != 'macos-latest'
        run: cargo build --release --bin taxa-mcp

      - name: Build taxa-mcp (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin --bin taxa-mcp
          cargo build --release --target x86_64-apple-darwin --bin taxa-mcp
          lipo -create -output taxa-mcp \
            target/aarch64-apple-darwin/release/taxa-mcp \
            target/x86_64-apple-darwin/release/taxa-mcp

      - name: Stage binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/taxa-mcp.exe "${{ matrix.artifact }}"
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp taxa-mcp "${{ matrix.artifact }}"
          else
            cp target/release/taxa-mcp "${{ matrix.artifact }}"
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Taxa $TAG" --generate-notes
          fi
          gh release upload "$TAG" "${{ matrix.artifact }}" --clobber
