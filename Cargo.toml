# Cargo workspace: the Tauri desktop app (src-tauri) plus the standalone
# taxa-mcp server (mcp). Keeping the MCP binary in its own crate means the
# Tauri bundler only sees one app binary and doesn't mistake taxa-mcp for a
# bundled sidecar.
[workspace]
resolver = "2"
members = ["src-tauri", "mcp"]

[workspace.package]
version = "0.4.4"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Desktop app: optimize for binary size (the Tauri template defaults).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
